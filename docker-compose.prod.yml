services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cylonai-app:latest
    container_name: cylonai-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    networks:
      - cylonai-net

networks:
  cylonai-net:
    external: true
